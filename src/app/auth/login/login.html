<div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="#4f8ef7"/>
          <path d="M10 26V14l8-4 8 4v12l-8 4-8-4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M18 10v16M10 14l8 4 8-4" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span> Sistema Aluguel</span>
      </div>
  
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Acesse sua conta para continuar</p>
  
      <div *ngIf="erro" class="error-msg">{{ erro }}</div>
  
      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
        </div>
  
        <div class="form-group">
          <label>Senha</label>
          <input type="password" [(ngModel)]="senha" name="senha" placeholder="••••••••" required />
        </div>
  
        <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>
  
      <p class="auth-link">Não tem conta? <a routerLink="/register">Criar conta</a></p>
    </div>
  </div>
