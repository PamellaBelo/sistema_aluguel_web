<div class="app-shell">
  <aside class="sidebar" [class.open]="menuOpen">

    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="logo-text">AluguelSys</span>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Geral</span>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen=false" class="nav-item">
        <span class="nav-icon" [innerHTML]="getIcon('grid')"></span> Dashboard
      </a>

      <span class="nav-section-label">Patrimônio</span>

      <!-- Imóveis com submenu -->
      <div class="nav-group">
        <a routerLink="/imoveis" routerLinkActive="active"
           class="nav-item nav-item-parent"
           (click)="menuOpen=false">
          <span class="nav-icon" [innerHTML]="getIcon('building')"></span>
          <span style="flex:1">Imóveis</span>
          <span class="nav-arrow" [class.open]="imoveisOpen"
                (click)="$event.preventDefault(); $event.stopPropagation(); toggleImoveis()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </a>

        <div class="nav-submenu" [class.open]="imoveisOpen">
          <a routerLink="/unidades" routerLinkActive="active" (click)="menuOpen=false" class="nav-item nav-sub-item">
            <span class="nav-icon" [innerHTML]="getIcon('layers')"></span> Unidades
          </a>
        </div>
      </div>

      <span class="nav-section-label">Locação</span>
      <a routerLink="/inquilinos" routerLinkActive="active" (click)="menuOpen=false" class="nav-item">
        <span class="nav-icon" [innerHTML]="getIcon('users')"></span> Inquilinos
      </a>
      <a routerLink="/contratos" routerLinkActive="active" (click)="menuOpen=false" class="nav-item">
        <span class="nav-icon" [innerHTML]="getIcon('file')"></span> Contratos
      </a>

      <span class="nav-section-label">Financeiro</span>
      <a routerLink="/contas" routerLinkActive="active" (click)="menuOpen=false" class="nav-item">
        <span class="nav-icon" [innerHTML]="getIcon('receipt')"></span> Contas
      </a>
      <a routerLink="/pagamentos" routerLinkActive="active" (click)="menuOpen=false" class="nav-item">
        <span class="nav-icon" [innerHTML]="getIcon('wallet')"></span> Pagamentos
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">{{ auth.getUser()?.nome?.charAt(0)?.toUpperCase() }}</div>
        <div class="user-text">
          <span class="user-name">{{ auth.getUser()?.nome }}</span>
          <span class="user-email">{{ auth.getUser()?.email }}</span>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()" title="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="overlay" *ngIf="menuOpen" (click)="menuOpen=false"></div>

  <div class="main-wrap">
    <header class="topbar">
      <button class="menu-toggle" (click)="menuOpen=!menuOpen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="logo-text">AluguelSys</span>
    </header>
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
