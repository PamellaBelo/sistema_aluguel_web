<div class="dashboard">
    <div class="page-header">
      <h1>Dashboard</h1>
    </div>
  
    <div *ngIf="loading" class="loading-grid">
      <div *ngFor="let i of [1,2,3,4]" class="skeleton-card"></div>
    </div>
  
    <div *ngIf="!loading && data" class="stats-grid">
      <div class="stat-card blue">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20"/><line x1="9" y1="22" x2="9" y2="2"/><line x1="15" y1="22" x2="15" y2="2"/>
            <line x1="4" y1="7" x2="9" y2="7"/><line x1="4" y1="12" x2="9" y2="12"/><line x1="4" y1="17" x2="9" y2="17"/>
            <line x1="15" y1="7" x2="20" y2="7"/><line x1="15" y1="12" x2="20" y2="12"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Total de Unidades</span>
          <span class="stat-value">{{ data.totalUnidades }}</span>
        </div>
      </div>
  
      <div class="stat-card green">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Casas Alugadas</span>
          <span class="stat-value">{{ data.unidadesAlugadas }}</span>
        </div>
      </div>
  
      <div class="stat-card warn">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Casas Vagas</span>
          <span class="stat-value">{{ data.unidadesVagas }}</span>
        </div>
      </div>
  
      <div class="stat-card red">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Contas Vencidas</span>
          <span class="stat-value">{{ data.contasPendentes }}</span>
        </div>
      </div>
    </div>
  
    <div *ngIf="!loading && data" class="revenue-card card">
      <div class="revenue-label">Receita Mensal Prevista</div>
      <div class="revenue-value">{{ formatCurrency(data.valorTotalReceber) }}</div>
      <div class="revenue-sub">Soma dos aluguéis ativos</div>
    </div>
  </div>
