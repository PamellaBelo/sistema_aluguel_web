<div>
  <div class="page-header">
    <div>
      <h1>Contas</h1>
      <p class="page-sub">Contas vinculadas aos contratos</p>
    </div>
    <button class="btn btn-primary" (click)="abrirNovo()" [disabled]="!contratoFiltro">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nova Conta
    </button>
  </div>

  <div class="card filtro-card">
    <div class="form-group">
      <label>Selecione um Contrato Ativo</label>
      <select [(ngModel)]="contratoFiltro" (ngModelChange)="carregarContas()">
        <option [ngValue]="null">Selecione...</option>
        <option *ngFor="let c of contratos" [ngValue]="c.id">
          {{ c.nomeUnidade }} — {{ c.nomeInquilino }}
        </option>
      </select>
    </div>
  </div>

  <div class="card" *ngIf="contratoFiltro">
    <div *ngIf="loading" class="empty-state">Carregando...</div>
    <div *ngIf="!loading && contas.length === 0" class="empty-state"><p>Nenhuma conta para este contrato</p></div>
    <table *ngIf="!loading && contas.length > 0">
      <thead>
        <tr><th>Tipo</th><th>Valor</th><th>Vencimento</th><th style="text-align:right">Ações</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of contas">
          <td><span class="badge badge-info">{{ tipoLabels[c.tipo] || c.tipo }}</span></td>
          <td class="mono">{{ formatCurrency(c.valor) }}</td>
          <td class="muted">{{ formatDate(c.vencimento) }}</td>
          <td>
            <div class="action-btns">
              <button class="btn btn-ghost btn-sm" (click)="abrirEditar(c)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Editar
              </button>
              <button class="btn btn-danger btn-sm" (click)="deletar(c.id)">Excluir</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="fecharModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ editandoId ? 'Editar Conta' : 'Nova Conta' }}</h2>
    <div *ngIf="erro" class="error-msg">{{ erro }}</div>
    <div style="display:flex; flex-direction:column; gap:.85rem;">
      <div class="form-group">
        <label>Contrato</label>
        <select [(ngModel)]="form.contratoId">
          <option [ngValue]="null" disabled>Selecione o contrato</option>
          <option *ngFor="let c of contratos" [ngValue]="c.id">{{ c.nomeUnidade }} — {{ c.nomeInquilino }}</option>
        </select>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Tipo</label>
          <select [(ngModel)]="form.tipo">
            <option value="AGUA">Água</option>
            <option value="LUZ">Luz</option>
            <option value="INTERNET">Internet</option>
            <option value="CONDOMINIO">Condomínio</option>
            <option value="IPTU">IPTU</option>
            <option value="OUTROS">Outros</option>
          </select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" [(ngModel)]="form.valor" placeholder="0,00" min="0" step="0.01" />
        </div>
      </div>
      <div class="form-group">
        <label>Vencimento</label>
        <input type="date" [(ngModel)]="form.vencimento" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" (click)="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" (click)="salvar()" [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </div>
</div>
