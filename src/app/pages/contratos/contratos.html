<div>
    <div class="page-header">
      <h1>Contratos</h1>
      <button class="btn btn-primary" (click)="abrirModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Contrato
      </button>
    </div>
  
    <div class="card">
      <div *ngIf="loading" class="empty-state">Carregando...</div>
      <div *ngIf="!loading && contratos.length === 0" class="empty-state"><p>Nenhum contrato cadastrado</p></div>
      <table *ngIf="!loading && contratos.length > 0">
        <thead>
          <tr><th>Unidade</th><th>Inquilino</th><th>Valor</th><th>Início</th><th>Fim</th><th>Status</th><th style="text-align:right">Ações</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of contratos">
            <td><strong> {{ c.nomeUnidade }} </strong></td>
            <td>{{ c.nomeInquilino }}</td>
            <td class="currency">{{ formatCurrency(c.valorAluguel) }}</td>
            <td>{{ formatDate(c.dataInicio) }}</td>
            <td>{{ formatDate(c.dataFim) }}</td>
            <td><span class="badge" [ngClass]="c.ativo ? 'badge-success' : 'badge-muted'">{{ c.ativo ? 'Ativo' : 'Encerrado' }}</span></td>
            <td style="text-align:right">
              <button *ngIf="c.ativo" class="btn btn-danger btn-sm" (click)="encerrar(c.id)">Encerrar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <div class="modal-overlay" *ngIf="showModal" (click)="fecharModal()">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>Novo Contrato</h2>
      <div *ngIf="erro" class="error-msg">{{ erro }}</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Unidade (somente vagas)</label>
          <select [(ngModel)]="form.unidadeId">
            <option [ngValue]="null" disabled>Selecione uma unidade</option>
            <option *ngFor="let c of unidades" [ngValue]="c.id">{{ c.nome }} — {{ c.nomeImovel }}</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Inquilino</label>
          <select [(ngModel)]="form.inquilinoId">
            <option [ngValue]="null" disabled>Selecione um inquilino</option>
            <option *ngFor="let i of inquilinos" [ngValue]="i.id">{{ i.nome }}</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Valor do Aluguel (R$)</label>
          <input type="number" [(ngModel)]="form.valorAluguel" placeholder="0,00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Data de Início</label>
          <input type="date" [(ngModel)]="form.dataInicio" />
        </div>
        <div class="form-group">
          <label>Data de Fim</label>
          <input type="date" [(ngModel)]="form.dataFim" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" (click)="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" (click)="salvar()" [disabled]="salvando">
          {{ salvando ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </div>
  </div>
